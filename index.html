<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F2EA">
<title>Hearth — our homeschool days</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-512.png">
<style>
:root{
  --paper:#F5F2EA; --paper2:#FBF9F3; --ink:#332F27; --ink2:#6E675A;
  --line:#E4DECD; --moss:#67754C; --moss-soft:#EDF0E4;
  --honey:#B98A2E; --honey-soft:#F6EEDC;
  --dusk:#5E7286; --dusk-soft:#E7ECF1;
  --stone:#9A948A; --stone-soft:#EFECE4;
  --berry:#8A5A63;
  --serif:Georgia,'Iowan Old Style','Times New Roman',serif;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding:0 16px 96px}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--moss);outline-offset:2px;border-radius:4px}
input,textarea,select{font-family:var(--sans);font-size:16px;color:var(--ink)}

/* top bar */
#topbar{display:flex;align-items:baseline;justify-content:space-between;padding:18px 2px 6px}
.brand{font-family:var(--serif);font-size:20px;letter-spacing:.04em}
.quiet{color:var(--ink2);font-size:13px}
.quietbtn{color:var(--ink2);font-size:13px;padding:6px 8px;border-radius:8px}
.quietbtn:active{background:var(--stone-soft)}

/* headings */
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink2);margin:14px 0 2px}
h1.date{font-family:var(--serif);font-weight:normal;font-size:28px;margin:0 0 2px;line-height:1.2}
.squig{display:block;width:120px;height:8px;margin:2px 0 14px}
h2.sect{font-family:var(--serif);font-weight:normal;font-size:19px;margin:22px 0 8px}
.sub{color:var(--ink2);font-size:13px;margin:-4px 0 10px}

/* cards */
.card{display:flex;align-items:center;gap:10px;background:var(--paper2);border:1px solid var(--line);border-radius:14px;padding:12px 12px;margin:8px 0;width:100%;text-align:left}
.card:active{background:#F3EFE3}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--stone)}
.card .t{flex:1;min-width:0;line-height:1.3}
.card .t small{display:block;color:var(--ink2);font-size:12px;margin-top:1px}
.chip{flex:none;font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);background:transparent}
.chip.Done{background:var(--moss-soft);border-color:var(--moss);color:var(--moss)}
.chip.Partial{background:var(--honey-soft);border-color:var(--honey);color:var(--honey)}
.chip.Moved{background:var(--dusk-soft);border-color:var(--dusk);color:var(--dusk)}
.chip.Skipped{background:var(--stone-soft);color:var(--stone)}
.check{flex:none;width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:transparent;font-size:16px}
.check.on{background:var(--moss);border-color:var(--moss);color:#fff}
.empty{color:var(--ink2);font-size:14px;background:transparent;border:1px dashed var(--line);border-radius:14px;padding:18px 14px;text-align:center;margin:10px 0;line-height:1.5}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:10px 16px;font-size:15px;border:1px solid var(--line);background:var(--paper2)}
.btn:active{background:#EFEBDD}
.btn.primary{background:var(--moss);border-color:var(--moss);color:#fff}
.btn.primary:active{background:#57633F}
.btn.small{padding:6px 12px;font-size:13px;border-radius:10px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.btn.wide{width:100%;padding:13px}

/* week */
.weeknav{display:flex;align-items:center;justify-content:space-between;margin:6px 0 2px}
.weeknav .range{font-family:var(--serif);font-size:19px}
.arrow{font-size:20px;padding:6px 14px;border-radius:10px;color:var(--ink2)}
.arrow:active{background:var(--stone-soft)}
.dayhead{display:flex;align-items:baseline;gap:8px;margin:20px 0 2px}
.dayhead .dn{font-family:var(--serif);font-size:18px}
.dayhead .dd{color:var(--ink2);font-size:13px}
.today-mark{font-size:11px;color:var(--moss);border:1px solid var(--moss);border-radius:999px;padding:1px 8px}
.past{opacity:.55}
.addline{color:var(--ink2);font-size:13px;padding:6px 4px;border-radius:8px}
.addline:active{background:var(--stone-soft)}
.basket{background:var(--paper2);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:12px 0}
.basket .card{background:var(--paper)}

/* archive */
.rec{background:var(--paper2);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.rec .rd{font-family:var(--serif);font-size:18px}
.rec .preview{color:var(--ink2);font-size:14px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.paper{white-space:pre-wrap;font-family:var(--serif);font-size:15.5px;line-height:26px;background:repeating-linear-gradient(transparent,transparent 25px,var(--line) 25px,var(--line) 26px);padding:0 2px;margin:12px 0}

/* tabs */
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:2px;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
#tabs button{font-family:var(--serif);font-size:13px;padding:12px 4px;flex:1;max-width:94px;min-width:0;border-radius:12px;color:var(--ink2);border-bottom:2px solid transparent}
#tabs button.on{color:var(--ink);border-bottom-color:var(--moss)}

/* sheet / modal */
#overlay{position:fixed;inset:0;background:rgba(44,39,28,.4);display:flex;align-items:flex-end;justify-content:center;z-index:50}
#overlay[hidden]{display:none}
#sheet{background:var(--paper2);width:100%;max-width:560px;max-height:92dvh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom))}
.sheettitle{font-family:var(--serif);font-size:21px;margin:0 0 12px}
.field{margin:12px 0}
.field label{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-bottom:5px}
.field input[type=text],.field input[type=date],.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--paper);color:var(--ink)}
.field textarea{min-height:64px;resize:vertical;line-height:1.45}
.field input[type=file]{max-width:100%;font-size:14px}
.statusrow{display:flex;gap:6px;flex-wrap:wrap}
.statusrow .chip{padding:7px 13px;font-size:13px}
.statusrow .chip.sel{border-width:1.5px;font-weight:600}
.statusrow .chip.sel.Planned{border-color:var(--ink);color:var(--ink)}
.dayspick{display:flex;gap:5px;flex-wrap:wrap}
.dayspick .chip{padding:7px 11px}
.dayspick .chip.sel{background:var(--moss-soft);border-color:var(--moss);color:var(--moss);font-weight:600}
.danger{color:var(--berry)}
hr.soft{border:none;border-top:1px solid var(--line);margin:16px 0}
.pinrow{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;width:100%;text-align:left}
.pinrow .pt{flex:1;font-family:var(--serif);font-size:16px}

/* toast */
#toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:14px;z-index:99;opacity:.95}
#toast[hidden]{display:none}

/* review wizard */
.wizcard{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;text-align:center}
.wizcard .wt{font-family:var(--serif);font-size:19px;margin-bottom:2px}
.wizopts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.progress{color:var(--ink2);font-size:12px;text-align:center;letter-spacing:.1em}

/* books and children's notebooks */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}
.filters button{border:1px solid var(--line);border-radius:999px;padding:8px 11px;font-size:13px;background:var(--paper2)}
.filters button.on{background:var(--moss-soft);border-color:var(--moss);color:var(--moss)}
.bookrow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px 12px;background:var(--paper2);border:1px solid var(--line);border-radius:14px;margin:10px 0}
.bookspine{width:8px;align-self:stretch;min-height:42px;border-radius:3px;background:var(--dusk);flex:none}
.booktitle{font-family:var(--serif);font-size:20px;line-height:1.3;overflow-wrap:anywhere}
.bookmeta{font-size:13px;color:var(--ink2);margin-top:5px;line-height:1.5}
.reading{border-left:3px solid var(--dusk)}
.reading .excerpt,.notetext{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;margin:10px 0;font-size:15px}
.reading-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.position{color:var(--dusk);font-size:14px;margin:8px 0}
.child-avatar{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:var(--honey-soft);font-family:var(--serif);font-size:22px;flex:none}
.notebook-row{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;background:var(--paper)}
.formpair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.noteimage{display:block;width:auto;max-width:100%;max-height:360px;height:auto;border-radius:10px;margin:10px 0}
.inline-new{border-left:2px solid var(--moss);padding-left:12px;margin:10px 0}
.storagewarning{color:var(--berry);font-size:14px;border:1px solid var(--berry);border-radius:12px;padding:12px;line-height:1.5}
[hidden]{display:none!important}
@media(max-width:360px){.formpair{grid-template-columns:1fr}#app{padding-left:12px;padding-right:12px}}

@media (prefers-reduced-motion: no-preference){
  #sheet{animation:up .18s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
}
/* Alisa's garden */
#app.garden-mode,#overlay.garden-mode,#tabs.garden-mode{
  --paper:#F9EBEE;--paper2:#FFF9F7;--ink:#503A40;--ink2:#795F66;
  --line:#E8CFD5;--moss:#9A5E73;--moss-soft:#F0DDE4;--stone-soft:#F2DEE5;
}
#app.garden-mode{background:var(--paper);border-radius:0 0 22px 22px;overflow-wrap:anywhere}
.garden-heading{text-align:center;padding:24px 4px 14px}
.garden-heading h1{font-size:32px;color:var(--moss)}
.garden-flowers{color:var(--moss);letter-spacing:.7em;font-size:18px;margin-bottom:14px;padding-left:.7em}
.garden-welcome{color:var(--ink2);font-size:14px;line-height:1.55;margin:8px 0 16px}
.garden-doors{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:12px 0}
.garden-door{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:180px;padding:20px 12px;background:var(--paper2);border:1px solid var(--line);outline:1px dashed var(--line);outline-offset:-7px;border-radius:22px;text-align:center;box-shadow:0 3px 0 #EEDBE2}
.garden-door:active{background:var(--moss-soft)}
.garden-icon{font-size:28px;margin-bottom:3px}
.garden-door-title{font-family:var(--serif);font-size:20px;line-height:1.25;color:var(--ink)}
.garden-door-hint{font-size:12px;line-height:1.6;color:var(--ink2);max-width:180px}
.garden-count{font-size:12px;color:var(--moss)}
.garden-quick{justify-content:center;margin:24px 0 10px}
.garden-footer{text-align:center;color:var(--moss);padding:16px 0;font-size:22px}
.garden-folder{display:flex;gap:14px;align-items:center;width:100%;background:var(--paper2);border:1px solid var(--line);border-radius:16px;text-align:left;padding:16px;margin:12px 0}
.garden-folder-info{flex:1;min-width:0}
.garden-folder-icon{font-size:24px;flex:none}
.garden-cover{width:54px;height:68px;object-fit:cover;border-radius:8px;flex:none}
.garden-resume{display:block;font-size:13px;color:var(--ink2);margin-top:8px;line-height:1.45;overflow-wrap:anywhere}
.garden-bookmark{background:var(--paper2);border-left:3px solid var(--moss);padding:12px 16px;margin:18px 0;border-radius:0 12px 12px 0}
.garden-bookmark .notetext{margin-bottom:0}
.garden-gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}
.garden-photo{text-align:left;min-width:0}
.garden-photo img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}
.garden-photo span{display:block;font-size:12px;line-height:1.5;margin-top:5px;color:var(--ink2);overflow-wrap:anywhere}
.garden-large-photo{display:block;width:auto;max-width:100%;height:auto;margin:0 auto;border-radius:12px}
.garden-photo-edit{padding:12px 0;border-bottom:1px solid var(--line)}
.garden-photo-thumb{display:block;width:100%;max-width:200px;max-height:180px;object-fit:contain;border-radius:10px}
.garden-materials a{color:var(--moss);text-decoration:underline;overflow-wrap:anywhere}
@media(max-width:360px){.garden-doors{gap:10px}.garden-door{padding:18px 10px}.garden-door-title{font-size:18px}.garden-gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}

</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">Hearth</div>
    <button class="quietbtn" onclick="openBackup()">Backup</button>
  </header>
  <div id="storageWarning" class="storagewarning" role="alert" hidden></div>
  <main id="view"></main>
</div>
<nav id="tabs">
  <button data-tab="today" onclick="setTab('today')">Today</button>
  <button data-tab="week" onclick="setTab('week')">Week</button>
  <button data-tab="books" onclick="setTab('books')">Книги</button>
  <button data-tab="children" onclick="setTab('children')">Дети</button>
  <button data-tab="garden" onclick="setTab('garden')">Сад</button>
  <button data-tab="archive" onclick="setTab('archive')">Архив</button>
</nav>
<div id="overlay" hidden>
  <div id="sheet" role="dialog" aria-modal="true"><div id="sheetBody"></div></div>
</div>
<div id="toast" hidden></div>

<script>
'use strict';
/* ============ constants ============ */
const TYPES=['Faith','Reading','Literacy','Час итальянского','Maths','History','Science','Nature','Craft','Arts & Culture','Practical life','Habits','Meal','Outing','Community','Mother culture','Child note','Other'];
const STATUSES=['Planned','Done','Partial','Moved','Skipped'];
const TYPE_DOT={'Faith':'#8A76A8','Reading':'#5E7286','Literacy':'#B98A2E','Час итальянского':'#B96B4A','Maths':'#67754C','History':'#7A5C43','Science':'#46878F','Nature':'#4E7A5A','Craft':'#B96B4A','Arts & Culture':'#6F6AA8','Practical life':'#8C8455','Habits':'#7D7A96','Meal':'#C2913F','Outing':'#5B8AA6','Community':'#B25E6E','Mother culture':'#8A5A63','Child note':'#A87676','Other':'#9A948A'};
const WD=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const WDS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const MO=['January','February','March','April','May','June','July','August','September','October','November','December'];

/* ============ storage ============ */
const KEY='hearth-state-v1';
const hasWinStorage = typeof window.storage==='object' && window.storage && typeof window.storage.get==='function';
const Store={
  async load(){
    if(hasWinStorage){
      try{const r=await window.storage.get(KEY); if(r&&r.value) return JSON.parse(r.value);}catch(e){}
      return null;
    }
    try{const s=localStorage.getItem(KEY); return s?JSON.parse(s):null;}catch(e){return null;}
  },
  async save(st){
    const s=JSON.stringify(st);
    try{
      if(hasWinStorage) await window.storage.set(KEY,s);
      else localStorage.setItem(KEY,s);
      document.getElementById('storageWarning').hidden=true;
      return true;
    }catch(e){
      console.error(e);
      const w=document.getElementById('storageWarning');
      w.textContent='Не удалось сохранить последние изменения на устройстве. Скачайте Backup, чтобы их сохранить. Возможно, закончилось место для фотографий.';
      w.hidden=false;
      return false;
    }
  }
};
let saveTimer=null;
function persist(){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>Store.save(state),350); }

/* ============ state ============ */
let state=null;
let tab='today';
let selectedDay=todayISO();
let weekOffset=0;
let editorStatus='Planned';
let selectedBook=null, bookFilter='reading';
let selectedChild=null, noteFilter='all';
let gardenSection=null, selectedGardenFolder=null, gardenPhotoDrafts={};
let editorEntries=[], editorNoteImage='', imageJobs=0;
const BOOK_STATUSES={reading:'Читаем',wishlist:'Хотим прочитать',finished:'Закончили',paused:'Отложили'};
const NOTE_KINDS=['Высказывание','Вопрос','Пересказ','Работа','Умение','Наблюдение'];
function initialChildren(){return ['Ллеу','Алау','Эмрис'].map(name=>({id:uid(),name,about:''}));}
function normalizeState(st){
  ['cards','records','library','pins','defaults','books','childEntries','gardenFolders','gardenEntries'].forEach(k=>{if(!Array.isArray(st[k]))st[k]=[];});
  if(!Array.isArray(st.children))st.children=initialChildren();
  st.books.forEach(b=>{if(!BOOK_STATUSES[b.status])b.status='reading';});
  st.gardenFolders.forEach(f=>{if(!GARDEN_SECTIONS[f.section])f.section='later';if(!GARDEN_STATUSES[f.status])f.status='idea';if(!Array.isArray(f.photos))f.photos=[];});
  st.gardenEntries.forEach(n=>{if(!Array.isArray(n.photos))n.photos=[];});
  return st;
}

function freshState(){
  return {
    cards:[], records:[], library:[], books:[], children:initialChildren(), childEntries:[], gardenFolders:[], gardenEntries:[], seeded:true,
    pins:[
      {id:uid(),title:'House rules',body:''},
      {id:uid(),title:'Anger scripts',body:''},
      {id:uid(),title:'Baby activities',body:''},
      {id:uid(),title:'Something motivational',body:''}
    ],
    defaults:[
      {id:uid(),title:'Bible / New Testament',type:'Faith',days:[0,1,2,3,4]},
      {id:uid(),title:'Букварь',type:'Literacy',days:[0,1,2,3,4]},
      {id:uid(),title:'Read-aloud',type:'Reading',days:[0,1,2,3,4]},
      {id:uid(),title:'Mother culture',type:'Mother culture',days:[0,1,2,3,4]}
    ]
  };
}
function uid(){ return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ============ date helpers ============ */
function pad(n){return (n<10?'0':'')+n;}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fromISO(s){return new Date(s+'T12:00:00');}
function todayISO(){return iso(new Date());}
function monday(d){const x=new Date(d); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x;}
function weekDates(offset){const m=monday(new Date()); m.setDate(m.getDate()+offset*7); const a=[]; for(let i=0;i<7;i++){const d=new Date(m); d.setDate(m.getDate()+i); a.push(iso(d));} return a;}
function fmtLong(s){const d=fromISO(s); return WD[(d.getDay()+6)%7]+', '+d.getDate()+' '+MO[d.getMonth()];}
function fmtShort(s){const d=fromISO(s); return d.getDate()+' '+MO[d.getMonth()].slice(0,3);}
function weekdayName(s){const d=fromISO(s); return WD[(d.getDay()+6)%7];}

/* ============ utils ============ */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(msg){const t=document.getElementById('toast'); t.textContent=msg; t.hidden=false; clearTimeout(t._h); t._h=setTimeout(()=>t.hidden=true,1800);}
function byId(id){return state.cards.find(c=>c.id===id);}
function liveCards(){return state.cards.filter(c=>!c.archived);}
function pendingDays(){
  const t=todayISO();
  return [...new Set(liveCards().filter(c=>c.date && c.date<t).map(c=>c.date))].sort().reverse();
}
function pendingDayRows(){
  return pendingDays().map(d=>'<button class="card" onclick="openDay(\''+d+'\')"><span class="t">'+fmtLong(d)+'<small>'+liveCards().filter(c=>c.date===d).length+' cards awaiting review</small></span><span class="quiet">›</span></button>').join('');
}
function openPendingDays(){
  openSheet('<h3 class="sheettitle">Days awaiting review</h3>'+pendingDayRows()+'<div class="btnrow"><button class="btn" onclick="closeSheet()">Close</button></div>');
}
function openDay(date){ selectedDay=date; closeSheet(); tab='today'; render(); window.scrollTo(0,0); }
function shiftDay(offset){const d=fromISO(selectedDay);d.setDate(d.getDate()+offset);openDay(iso(d));}
function reopenCard(c){
  if(!c.archived) return;
  const r=state.records.find(r=>r.date===c.date);
  // Older backups have snapshots without IDs. Link before editing the title.
  const s=r && (r.cards||[]).find(s=>!s.id && s.title===c.title && s.type===c.type);
  if(s) s.id=c.id;
  c.archived=false;
}
const SQUIG='<svg class="squig" viewBox="0 0 120 8" aria-hidden="true"><path d="M2 5 C 20 1, 40 8, 60 4 S 100 2, 118 5" fill="none" stroke="#67754C" stroke-width="2" stroke-linecap="round"/></svg>';

/* ============ tabs & render ============ */
function setTab(t){closeSheet();tab=t;if(t==='today')selectedDay=todayISO();if(t==='week')weekOffset=0;if(t==='books')selectedBook=null;if(t==='children')selectedChild=null;if(t==='garden'){gardenSection=null;selectedGardenFolder=null;}render();window.scrollTo(0,0);}
function render(){
  ['app','overlay','tabs'].forEach(id=>document.getElementById(id).classList.toggle('garden-mode',tab==='garden'));
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  const v=document.getElementById('view');
  if(tab==='today') v.innerHTML=renderToday();
  else if(tab==='week') v.innerHTML=renderWeek();
  else if(tab==='books') v.innerHTML=selectedBook?renderBook():renderBooks();
  else if(tab==='children') v.innerHTML=selectedChild?renderChild():renderChildren();
  else if(tab==='garden') v.innerHTML=selectedGardenFolder?renderGardenFolder():gardenSection?renderGardenSection():renderGarden();
  else v.innerHTML=renderArchive();
}

/* ============ card row ============ */
function cardRow(c,showDay){
  const dot=TYPE_DOT[c.type]||'#9A948A';
  const book=state.books.find(b=>b.id===c.bookId);
  const folder=gardenFolderById(c.gardenId);
  const sub=(showDay?('<small>'+(c.date?fmtShort(c.date):'Idea Basket')+'</small>'):'')+(c.type==='Reading'&&book?'<small>'+esc(book.title)+'</small>':'')+(c.type==='Mother culture'&&folder?'<small>Алисин сад · '+esc(folder.title)+'</small>':'');
  return '<button class="card" onclick="openCard(\''+c.id+'\')">'
    +'<span class="dot" style="background:'+dot+'"></span>'
    +'<span class="t">'+esc(c.title||'(untitled)')+sub+'</span>'
    +'<span class="chip '+c.status+'">'+c.status+'</span>'
    +'<span class="check '+(c.status==='Done'?'on':'')+'" role="button" aria-label="mark done" onclick="event.stopPropagation();toggleDone(\''+c.id+'\')">✓</span>'
    +'</button>';
}
function toggleDone(id){const c=byId(id); if(!c)return; reopenCard(c); c.status=(c.status==='Done')?'Planned':'Done'; persist(); render();}

/* ============ TODAY ============ */
function renderToday(){
  const t=selectedDay;
  const cards=state.cards.filter(c=>c.date===t);
  const record=state.records.find(r=>r.date===t);
  const pending=pendingDays();
  let h='<div class="weeknav"><button class="arrow" onclick="shiftDay(-1)" aria-label="previous day">‹</button><span class="quiet">'+(t===todayISO()?'Today':'Day')+'</span><button class="arrow" onclick="shiftDay(1)" aria-label="next day">›</button></div>';
  h+='<h1 class="date">'+fmtLong(t)+'</h1>'+SQUIG;
  if(t!==todayISO()) h+='<button class="quietbtn" onclick="openDay(todayISO())">Back to today</button>';
  if(pending.length) h+='<div class="btnrow"><button class="btn small" onclick="openPendingDays()">Days awaiting review · '+pending.length+'</button></div>';
  h+='<div class="btnrow"><button class="btn small" onclick="openPins()">📌 Pinned</button></div>';
  if(cards.length===0){
    h+='<div class="empty">No cards for this day yet.<br>Open <b>Week</b> to plan, or add what happened.</div>';
  } else {
    h+=cards.map(c=>cardRow(c,false)).join('');
  }
  h+='<div class="btnrow"><button class="btn" onclick="openHappened()">+ Happened</button><button class="btn" onclick="openCardEditor(null,\''+t+'\')">+ Card</button><button class="btn" onclick="openLibrary(\''+t+'\')">📚 Library</button></div>';
  if(record) h+='<h2 class="sect">Saved review</h2><div class="paper">'+esc(record.review)+'</div>';
  h+='<hr class="soft"><button class="btn wide" onclick="startReview()">'+(record?'Edit / update review':'End the day · Generate review')+'</button>';
  h+='<p class="quiet" style="text-align:center;margin-top:10px">Cards stay available. You can finish this day\'s review whenever you have time.</p>';
  return h;
}

/* ============ WEEK ============ */
function renderWeek(){
  const days=weekDates(weekOffset);
  const t=todayISO();
  const label = weekOffset===0 ? 'This week' : (fmtShort(days[0])+' – '+fmtShort(days[6]));
  let h='<div class="weeknav"><button class="arrow" onclick="weekOffset--;render()" aria-label="previous week">‹</button>'
      +'<span class="range">'+label+'</span>'
      +'<button class="arrow" onclick="weekOffset++;render()" aria-label="next week">›</button></div>';
  if(weekOffset!==0) h+='<div style="text-align:center"><button class="quietbtn" onclick="weekOffset=0;render()">back to this week</button></div>';
  h+='<div class="btnrow"><button class="btn small" onclick="fillWeek()">Fill from defaults</button><button class="btn small" onclick="openDefaults()">Edit defaults</button><button class="btn small" onclick="openLibrary(null)">📚 Library</button></div>';

  const basket=liveCards().filter(c=>!c.date);
  h+='<div class="basket"><h2 class="sect" style="margin:0 0 2px">Idea Basket</h2><div class="sub">Ideas for the week, not tied to a day</div>';
  h+= basket.length? basket.map(c=>cardRow(c,false)).join('') : '<div class="quiet" style="padding:4px 0 6px">Empty — ideas can wait here.</div>';
  h+='<button class="addline" onclick="openCardEditor(null,null)">+ Add idea</button></div>';

  days.forEach((d,i)=>{
    const cards=state.cards.filter(c=>c.date===d);
    const isToday=d===t, isPast=d<t;
    h+='<div class="'+(isPast&&!isToday?'past':'')+'">';
    h+='<div class="dayhead"><button class="dn" onclick="openDay(\''+d+'\')">'+WD[i]+'</button><span class="dd">'+fmtShort(d)+'</span>'+(isToday?'<span class="today-mark">today</span>':'')+'</div>';
    h+=cards.map(c=>cardRow(c,false)).join('');
    h+='<button class="addline" onclick="openCardEditor(null,\''+d+'\')">+ Add card</button>';
    h+='</div>';
  });
  return h;
}

function fillWeek(){
  const days=weekDates(weekOffset);
  const t=todayISO();
  let added=0;
  state.defaults.forEach(df=>{
    (df.days||[]).forEach(i=>{
      const d=days[i];
      if(weekOffset===0 && d<t) return; // don't plan the past
      const exists=state.cards.some(c=>c.date===d && c.title===df.title);
      if(!exists){
        state.cards.push({id:uid(),title:df.title,type:df.type,status:'Planned',date:d,details:'',materials:'',childNotes:'',happened:'',archived:false});
        added++;
      }
    });
  });
  persist(); render();
  toast(added? 'Added '+added+' cards from defaults' : 'Week already has these');
}

/* ============ ARCHIVE ============ */
function renderArchive(){
  let h='<div class="eyebrow">Archive</div><h1 class="date">Day records</h1>'+SQUIG;
  const pending=pendingDays();
  if(pending.length) h+='<h2 class="sect">Awaiting review</h2>'+pendingDayRows();
  if(state.records.length===0){
    if(!pending.length) h+='<div class="empty">No day records yet.<br>Open any day to create its review.</div>';
    return h;
  }
  const recs=[...state.records].sort((a,b)=>b.date<a.date?-1:1);
  recs.forEach(r=>{
    const first=(r.review||'').split('\n').find(l=>l.trim())||'';
    h+='<div class="rec">'
      +'<button style="width:100%;text-align:left" onclick="toggleRec(\''+r.id+'\')">'
      +'<div class="rd">'+fmtLong(r.date)+'</div>'
      +'<div class="preview">'+esc(first)+'</div></button>'
      +'<div id="rec-'+r.id+'" hidden>'
      +'<div class="paper">'+esc(r.review)+'</div>'
      +(r.cards&&r.cards.length? r.cards.map(s=>'<div class="quiet" style="padding:2px 0">• '+esc(s.title)+' — '+esc(s.status)+(s.movedTo?' → '+esc(s.movedTo):'')+'</div>').join(''):'')
      +'<div class="btnrow"><button class="btn small" onclick="openDay(\''+r.date+'\')">Open day / edit review</button><button class="btn small danger" onclick="delRecord(\''+r.id+'\')">Delete record</button></div>'
      +'</div></div>';
  });
  return h;
}
function toggleRec(id){const el=document.getElementById('rec-'+id); if(el) el.hidden=!el.hidden;}
function delRecord(id){ if(!confirm('Delete this day record? This cannot be undone.'))return; state.records=state.records.filter(r=>r.id!==id); persist(); render(); }

/* ============ sheet plumbing ============ */
/* ============ books ============ */
function bookById(id){return state.books.find(b=>b.id===id);}
function childById(id){return state.children.find(c=>c.id===id);}
function bookReadings(id){
  return state.cards.filter(c=>c.type==='Reading'&&c.bookId===id&&c.date&&['Done','Partial'].includes(c.status))
    .sort((a,b)=>b.date.localeCompare(a.date)||(b.createdAt||b.id).localeCompare(a.createdAt||a.id));
}
function latestPosition(id){return bookReadings(id).find(c=>(c.readingPosition||'').trim())||null;}
function setBookFilter(f){bookFilter=f;render();}
function openBook(id){selectedBook=id;tab='books';closeSheet();render();window.scrollTo(0,0);}
function renderBooks(){
  let h='<div class="eyebrow">Семейная полка</div><h1 class="date">Наши книги</h1>'+SQUIG;
  h+='<div class="sub" style="margin-top:8px">Читаем вместе. Каждая книга хранит историю ваших чтений.</div>';
  h+='<div class="filters" aria-label="Полки">'+Object.entries(BOOK_STATUSES).map(([k,v])=>'<button class="'+(bookFilter===k?'on':'')+'" aria-pressed="'+(bookFilter===k)+'" onclick="setBookFilter(\''+k+'\')">'+v+' · '+state.books.filter(b=>b.status===k).length+'</button>').join('')+'</div>';
  const books=state.books.filter(b=>b.status===bookFilter);
  h+=books.length?books.map(b=>{
    const last=latestPosition(b.id);
    return '<button class="bookrow" onclick="openBook(\''+b.id+'\')"><span class="bookspine" aria-hidden="true"></span><span style="flex:1;min-width:0"><span class="booktitle">'+esc(b.title)+'</span><span class="bookmeta" style="display:block">'+esc([b.author,b.language].filter(Boolean).join(' · '))+'</span>'+(last?'<span class="bookmeta" style="display:block">Остановились: '+esc(last.readingPosition)+'</span>':'')+'</span><span class="quiet" aria-hidden="true">›</span></button>';
  }).join(''):'<div class="empty">'+(bookFilter==='reading'?'Здесь будут книги, которые вы читаете вместе.':'На этой полке пока нет книг.')+'</div>';
  h+='<div class="btnrow"><button class="btn primary" onclick="openBookEditor(null)">+ Добавить книгу</button></div>';
  const unlinked=state.cards.filter(c=>c.type==='Reading'&&!c.bookId&&c.date&&['Done','Partial'].includes(c.status));
  if(unlinked.length){
    h+='<h2 class="sect">Чтения без книги · '+unlinked.length+'</h2><div class="sub">Откройте карточку и выберите книгу — запись появится в её истории.</div>';
    h+=unlinked.sort((a,b)=>b.date.localeCompare(a.date)).map(c=>cardRow(c,true)).join('');
  }
  return h;
}
function renderBook(){
  const b=bookById(selectedBook);
  if(!b){selectedBook=null;return renderBooks();}
  const readings=bookReadings(b.id), last=latestPosition(b.id);
  let h='<button class="quietbtn" onclick="setTab(\'books\')">‹ Все книги</button><div class="eyebrow">'+BOOK_STATUSES[b.status]+'</div><h1 class="date">'+esc(b.title)+'</h1>'+SQUIG;
  h+='<div class="bookmeta">'+esc([b.author,b.language].filter(Boolean).join(' · '))+'</div>';
  if(last)h+='<div class="basket"><div class="quiet">Последнее записанное место · '+fmtShort(last.date)+'</div><div class="position">'+esc(last.readingPosition)+'</div></div>';
  h+='<div class="btnrow"><button class="btn primary" onclick="continueReading(\''+b.id+'\')">'+(b.status==='finished'?'+ Ещё одно чтение':'Продолжить чтение')+'</button><button class="btn" onclick="openBookEditor(\''+b.id+'\')">О книге</button></div>';
  h+='<h2 class="sect">Наши чтения'+(readings.length?' · '+readings.length:'')+'</h2>';
  h+=readings.length?readings.map(c=>{
    const notes=state.childEntries.filter(n=>n.cardId===c.id);
    return '<article class="rec reading"><div class="reading-top"><button class="quietbtn" style="padding-left:0" onclick="openDay(\''+c.date+'\')">'+fmtLong(c.date)+'</button><span class="chip '+c.status+'">'+(c.status==='Done'?'Прочитали':'Читали немного')+'</span></div><div class="booktitle" style="font-size:18px">'+esc(c.title)+'</div>'+(c.readingPosition?'<div class="position">Остановились: '+esc(c.readingPosition)+'</div>':'')+(c.happened?'<div class="excerpt">'+esc(c.happened)+'</div>':'')+(c.childNotes?'<div class="excerpt"><span class="quiet">Детские отклики</span><br>'+esc(c.childNotes)+'</div>':'')+notes.map(n=>noteRow(n,true)).join('')+'<button class="btn small" onclick="openCard(\''+c.id+'\')">Открыть карточку</button></article>';
  }).join(''):'<div class="empty">После чтения отметьте карточку Reading выполненной.<br>Она появится здесь и останется в своём дне.</div>';
  const plans=state.cards.filter(c=>c.type==='Reading'&&c.bookId===b.id&&c.status==='Planned');
  if(plans.length)h+='<h2 class="sect">Запланировано</h2>'+plans.map(c=>cardRow(c,true)).join('');
  h+='<h2 class="sect">Заметки о книге</h2>'+(b.notes?'<div class="paper">'+esc(b.notes)+'</div>':'<div class="quiet">Мысли о книге, любимые строки, идеи для обсуждения.</div>')+'<div class="btnrow"><button class="btn small" onclick="openBookEditor(\''+b.id+'\')">Записать мысль</button></div>';
  return h;
}
function continueReading(id){
  const b=bookById(id);if(!b)return;
  openCardEditor(null,todayISO(),{title:'Чтение · '+b.title,type:'Reading',bookId:id});
}
function openBookEditor(id){
  const b=id?bookById(id):null;
  let h='<h3 class="sheettitle">'+(b?'О книге':'Новая книга')+'</h3>';
  h+='<div class="field"><label for="b-title">Название</label><input type="text" id="b-title" value="'+esc(b?b.title:'')+'"></div>';
  h+='<div class="field"><label for="b-author">Автор</label><input type="text" id="b-author" value="'+esc(b?b.author:'')+'"></div>';
  h+='<div class="field"><label for="b-language">Язык</label><input type="text" id="b-language" placeholder="Например: русский, italiano, Cymraeg" value="'+esc(b?b.language:'')+'"></div>';
  h+='<div class="field"><label for="b-status">Полка</label><select id="b-status">'+Object.entries(BOOK_STATUSES).map(([k,v])=>'<option value="'+k+'"'+((b?b.status:bookFilter)===k?' selected':'')+'>'+v+'</option>').join('')+'</select></div>';
  h+='<div class="field"><label for="b-notes">Заметки о книге</label><textarea id="b-notes" style="min-height:120px">'+esc(b?b.notes:'')+'</textarea></div>';
  h+='<div class="btnrow"><button class="btn primary" onclick="saveBook(\''+(b?b.id:'')+'\')">Сохранить</button><button class="btn" onclick="closeSheet()">Отмена</button>'+(b?'<button class="quietbtn danger" onclick="deleteBook(\''+b.id+'\')">Убрать с полки</button>':'')+'</div>';
  openSheet(h);
}
function saveBook(id){
  const g=x=>document.getElementById(x).value;
  const title=g('b-title').trim();if(!title){toast('Как называется книга?');return;}
  const data={title,author:g('b-author').trim(),language:g('b-language').trim(),status:g('b-status'),notes:g('b-notes')};
  if(id)Object.assign(bookById(id),data);
  else {id=uid();state.books.push(Object.assign({id},data));}
  persist();openBook(id);toast('Книга на полке');
}
function deleteBook(id){
  if(!confirm('Убрать книгу с полки? Карточки дня и детские записи сохранятся.'))return;
  state.books=state.books.filter(b=>b.id!==id);
  state.cards.forEach(c=>{if(c.bookId===id)c.bookId=null;});
  state.childEntries.forEach(n=>{if(n.bookId===id)n.bookId=null;});
  selectedBook=null;persist();closeSheet();render();
}
function readingFields(prefix,c){
  const id=c.bookId||'';
  const last=id?latestPosition(id):null;
  return '<div id="'+prefix+'-reading"'+(c.type==='Reading'?'':' hidden')+'><div class="field"><label for="'+prefix+'-book">Книга</label><select id="'+prefix+'-book" onchange="updateBookFields(\''+prefix+'\')"><option value="">Без книги</option>'+state.books.map(b=>'<option value="'+b.id+'"'+(id===b.id?' selected':'')+'>'+esc(b.title)+'</option>').join('')+'<option value="__new">+ Новая книга…</option></select></div>'
    +'<div id="'+prefix+'-new-book" class="inline-new" hidden><div class="field"><label for="'+prefix+'-new-title">Название новой книги</label><input type="text" id="'+prefix+'-new-title"></div><div class="formpair"><div class="field"><label for="'+prefix+'-new-author">Автор</label><input type="text" id="'+prefix+'-new-author"></div><div class="field"><label for="'+prefix+'-new-language">Язык</label><input type="text" id="'+prefix+'-new-language"></div></div></div>'
    +'<div id="'+prefix+'-last-place" class="quiet">'+(last?'Ранее: '+esc(last.readingPosition)+' · '+fmtShort(last.date):'')+'</div>'
    +'<div class="field"><label for="'+prefix+'-position">Где остановились · необязательно</label><input type="text" id="'+prefix+'-position" value="'+esc(c.readingPosition||'')+'" placeholder="Глава, страница или последние слова"></div></div>';
}
function updateReadingFields(prefix){
  document.getElementById(prefix+'-reading').hidden=document.getElementById(prefix+'-type').value!=='Reading';
  updateGardenCardFields(prefix);
}
function updateBookFields(prefix){
  const id=document.getElementById(prefix+'-book').value;
  document.getElementById(prefix+'-new-book').hidden=id!=='__new';
  const last=latestPosition(id);
  document.getElementById(prefix+'-last-place').textContent=last?'Ранее: '+last.readingPosition+' · '+fmtShort(last.date):'';
}
function readBookFields(prefix){
  if(document.getElementById(prefix+'-type').value!=='Reading')return {bookId:null,readingPosition:''};
  const g=x=>document.getElementById(prefix+'-'+x).value;
  let bookId=g('book')||null;
  if(bookId==='__new'){
    const title=g('new-title').trim();
    if(!title){toast('Укажите название новой книги');return null;}
    bookId=uid();
    state.books.push({id:bookId,title,author:g('new-author').trim(),language:g('new-language').trim(),status:'reading',notes:''});
  }
  return {bookId,readingPosition:g('position').trim()};
}

function noteRow(n,compact){
  const child=childById(n.childId), card=n.cardId?byId(n.cardId):null, book=bookById(card?card.bookId:n.bookId);
  return '<article class="'+(compact?'notebook-row':'rec')+'"><div class="reading-top"><span class="quiet">'+esc(compact&&child?child.name+' · '+n.kind:n.kind)+' · '+fmtShort(n.date)+'</span><button class="quietbtn" onclick="openChildNote(\''+n.id+'\')">Изменить</button></div>'
    +(n.text?'<div class="notetext">'+esc(n.text)+'</div>':'')+(n.image?'<img class="noteimage" src="'+safeImage(n.image)+'" alt="Работа ребёнка'+(child?' — '+esc(child.name):'')+'">':'')
    +'<div class="btnrow" style="margin-bottom:0">'+(compact&&child?'<button class="quietbtn" onclick="openChild(\''+child.id+'\')">Тетрадь '+esc(child.name)+'</button>':'')+(card?'<button class="quietbtn" onclick="openCard(\''+card.id+'\')">Из карточки: '+esc(card.title)+'</button>':'')+(book?'<button class="quietbtn" onclick="openBook(\''+book.id+'\')">'+esc(book.title)+'</button>':'')+(!compact?'<button class="quietbtn" onclick="openDay(\''+n.date+'\')">День</button>':'')+'</div></article>';
}

  const about=document.getElementById('ch-about').value;
  if(id)Object.assign(childById(id),{name,about});

function childOptions(id){return state.children.map(c=>'<option value="'+c.id+'"'+(c.id===id?' selected':'')+'>'+esc(c.name)+'</option>').join('');}
function kindOptions(kind){return NOTE_KINDS.map(k=>'<option'+(k===kind?' selected':'')+'>'+k+'</option>').join('');}

  h+='<div class="field"><label for="n-date">Дата</label><input type="date" id="n-date" value="'+esc(n?n.date:todayISO())+'"></div>';
  h+='<div class="field"><label for="n-text">Запись</label><textarea id="n-text" style="min-height:140px" placeholder="Слова ребёнка, вопрос, пересказ, новое умение…">'+esc(n?n.text:'')+'</textarea></div>';
  h+='<div class="field"><label for="n-book">Книга · необязательно</label><select id="n-book"'+(n&&n.cardId?' disabled':'')+'><option value="">Без книги</option>'+state.books.map(b=>'<option value="'+b.id+'"'+(n&&b.id===n.bookId?' selected':'')+'>'+esc(b.title)+'</option>').join('')+'</select></div>';
  h+='<div class="field"><label for="n-photo">Рисунок или работа · фото</label><input type="file" id="n-photo" accept="image/jpeg,image/png,image/webp" onchange="loadNoteImage(this,-1)"><div id="n-photo-preview">'+imagePreview(editorNoteImage,-1)+'</div></div>';

  openSheet(h);

function safeImage(s){return /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(s)?s:'';}
function imagePreview(src,index){
  return src?'<img class="noteimage" src="'+safeImage(src)+'" alt="Прикреплённая работа"><button class="quietbtn danger" onclick="removeNoteImage('+index+')">Убрать фото</button>':'';
}
async function compressPhoto(file){
  if(file.size>12*1024*1024)throw new Error('Выберите фото меньше 12 МБ.');
  if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('Подойдут JPG, PNG и WebP.');
  const raw=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(new Error('Не удалось открыть фото.'));r.readAsDataURL(file);});
  const img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=()=>reject(new Error('Не удалось прочитать изображение.'));i.src=raw;});
  const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');
  let ratio=Math.min(1,1100/Math.max(img.width,img.height)),result='';
  for(let pass=0;pass<5;pass++){
    canvas.width=Math.max(1,Math.round(img.width*ratio));canvas.height=Math.max(1,Math.round(img.height*ratio));
    ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);
    result=canvas.toDataURL('image/jpeg',.78);
    if(result.length<=240000)return result;
    ratio*=.78;
  }
  throw new Error('Фото слишком большое. Попробуйте уменьшить его.');
}
async function loadNoteImage(input,index){
  const file=input.files[0];if(!file)return;
  const target=document.getElementById(index<0?'n-photo-preview':'cn-photo-'+index);
  const entry=index<0?null:editorEntries[index];
  imageJobs++;target.textContent='Готовлю фото…';
  try{
    const photo=await compressPhoto(file);
    if(!target.isConnected)return;
    if(index<0)editorNoteImage=photo;else entry.image=photo;
    target.innerHTML=imagePreview(photo,index);
  }catch(e){if(target.isConnected)target.innerHTML=imagePreview(index<0?editorNoteImage:entry.image,index);toast(e.message);}
  finally{imageJobs--;input.value='';}
}
function removeNoteImage(index){
  if(index<0)editorNoteImage='';else editorEntries[index].image='';
  document.getElementById(index<0?'n-photo-preview':'cn-photo-'+index).innerHTML='';
}
function saveChildNote(id){
  if(imageJobs){toast('Фото ещё готовится');return;}
  const g=x=>document.getElementById(x).value;
  const text=g('n-text').trim(),childId=g('n-child'),date=g('n-date');
  if(!childId||!date){toast('Выберите ребёнка и дату');return;}
  if(!text&&!editorNoteImage){toast('Добавьте запись или фото');return;}
  const n=id?state.childEntries.find(x=>x.id===id):null;
  const card=n&&n.cardId?byId(n.cardId):null;
  const data={childId,date,kind:g('n-kind'),text,image:editorNoteImage,bookId:card?card.bookId:g('n-book')||null};
  if(n)Object.assign(n,data);
  else state.childEntries.push(Object.assign({id:uid(),cardId:null},data));
  if(card)reopenCard(card);
  persist();closeSheet();render();toast('В тетради');
}
function deleteChildNote(id){
  if(!confirm('Удалить эту запись из детской тетради?'))return;
  const n=state.childEntries.find(n=>n.id===id),card=n&&n.cardId?byId(n.cardId):null;
  if(card)reopenCard(card);
  state.childEntries=state.childEntries.filter(n=>n.id!==id);persist();closeSheet();render();
}
function collectEditorEntries(){
  editorEntries.forEach((n,i)=>{
    const row=document.getElementById('cn-'+i);if(!row)return;
    n.childId=document.getElementById('cn-child-'+i).value;
    n.kind=document.getElementById('cn-kind-'+i).value;
    n.text=document.getElementById('cn-text-'+i).value;
  });
}
function editorEntryRows(){
  return editorEntries.map((n,i)=>'<div class="notebook-row" id="cn-'+i+'"><div class="formpair"><div class="field"><label for="cn-child-'+i+'">Ребёнок</label><select id="cn-child-'+i+'">'+childOptions(n.childId)+'</select></div><div class="field"><label for="cn-kind-'+i+'">Что сохраним</label><select id="cn-kind-'+i+'">'+kindOptions(n.kind)+'</select></div></div><div class="field"><label for="cn-text-'+i+'">Запись в тетрадь</label><textarea id="cn-text-'+i+'">'+esc(n.text)+'</textarea></div><div class="field"><label for="cn-file-'+i+'">Фото работы</label><input type="file" id="cn-file-'+i+'" accept="image/jpeg,image/png,image/webp" onchange="loadNoteImage(this,'+i+')"><div id="cn-photo-'+i+'">'+imagePreview(n.image,i)+'</div></div><button class="quietbtn" onclick="removeEditorEntry('+i+')">'+(n.cardId?'Оставить только в тетради':'Убрать запись')+'</button></div>').join('');
}
function addEditorEntry(){
  if(imageJobs){toast('Фото ещё готовится');return;}
  collectEditorEntries();editorEntries.push({id:uid(),childId:state.children[0]?state.children[0].id:'',kind:'Наблюдение',text:'',image:''});
  document.getElementById('f-entries').innerHTML=editorEntryRows();
}
function removeEditorEntry(i){
  if(imageJobs){toast('Фото ещё готовится');return;}
  collectEditorEntries();editorEntries.splice(i,1);document.getElementById('f-entries').innerHTML=editorEntryRows();
}
function saveEditorEntries(card){
  const editedIds=new Set(editorEntries.map(n=>n.id));
  state.childEntries.forEach(n=>{if(n.cardId===card.id&&!editedIds.has(n.id))n.cardId=null;});
  state.childEntries=state.childEntries.filter(n=>n.cardId!==card.id);
  editorEntries.filter(n=>(n.text||'').trim()||n.image).forEach(n=>{
    state.childEntries.push(Object.assign({},n,{cardId:card.id,bookId:card.bookId||null,date:card.date||n.date||todayISO(),text:n.text.trim()}));
  });
}

function openSheet(html){
  document.getElementById('sheetBody').innerHTML=html;
  document.getElementById('sheetBody').querySelectorAll('.field').forEach(f=>{
    const label=f.querySelector('label'),input=f.querySelector('input,textarea,select');
    if(label&&input&&input.id)label.htmlFor=input.id;
  });
  const o=document.getElementById('overlay');o.hidden=false;document.getElementById('sheet').scrollTop=0;
}
function closeSheet(){ document.getElementById('overlay').hidden=true; }
document.getElementById('overlay').addEventListener('click',e=>{ if(e.target.id==='overlay') closeSheet(); });
document.getElementById('overlay').addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});

/* ============ Alisa's garden ============ */
const GARDEN_SECTIONS={
  read:{title:'Почитать и посмотреть',hint:'Книги, фильмы, спектакли и мысли после',icon:'📖'},
  make:{title:'Сотворить',hint:'Раскраски, рукоделие, песни и маленькие затеи',icon:'🧵'},
  projects:{title:'Мои проекты',hint:'Итальянский, рассказы, Лирана — свои папочки',icon:'🌱'},
  later:{title:'На потом',hint:'Прекрасные идеи, к которым хочется вернуться',icon:'✨'}
};
const GARDEN_STATUSES={idea:'Задумка',active:'В процессе',paused:'На паузе',done:'Завершено'};
const GARDEN_MEDIA={book:'Книга',film:'Фильм',series:'Сериал',play:'Спектакль',other:'Другое'};
function gardenFolderById(id){return (state.gardenFolders||[]).find(f=>f.id===id);}
function gardenStatusLabel(f){
  if(f.section==='later')return 'На потом';
  if(f.section==='read'&&f.status==='active')return f.medium==='book'?'Читаю':'Смотрю';
  if(f.section==='read'&&f.status==='done')return f.medium==='book'?'Прочитано':'Посмотрено';
  return GARDEN_STATUSES[f.status]||GARDEN_STATUSES.idea;
}
function gardenHistory(id){
  const notes=(state.gardenEntries||[]).filter(n=>n.folderId===id).map(n=>({kind:'entry',date:n.date,createdAt:n.createdAt||n.id,data:n}));
  const cards=state.cards.filter(c=>c.type==='Mother culture'&&c.gardenId===id&&c.date&&['Done','Partial'].includes(c.status)).map(c=>({kind:'card',date:c.date,createdAt:c.createdAt||c.id,data:c}));
  return notes.concat(cards).sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt.localeCompare(a.createdAt));
}
function gardenMaterials(text){
  return esc(text).replace(/https?:\/\/[^\s<>]+/g,url=>'<a href="'+url+'" target="_blank" rel="noopener noreferrer">'+url+'</a>');
}
function openGardenSection(section){gardenSection=section;selectedGardenFolder=null;tab='garden';closeSheet();render();window.scrollTo(0,0);}
function openGardenFolder(id){const f=gardenFolderById(id);if(!f)return;gardenSection=f.section;selectedGardenFolder=id;tab='garden';closeSheet();render();window.scrollTo(0,0);}
function renderGarden(){
  let h='<div class="garden-heading"><div class="garden-flowers" aria-hidden="true">✿ · ✧ · ✿</div><div class="eyebrow">Время для себя</div><h1 class="date">Алисин сад</h1><p class="garden-welcome">Что хочется сделать сегодня?</p></div><div class="garden-doors">';
  h+=Object.entries(GARDEN_SECTIONS).map(([id,s])=>'<button class="garden-door" onclick="openGardenSection(\''+id+'\')"><span class="garden-icon" aria-hidden="true">'+s.icon+'</span><span class="garden-door-title">'+s.title+'</span><span class="garden-door-hint">'+s.hint+'</span>'+(state.gardenFolders.some(f=>f.section===id)?'<span class="garden-count">Папочек: '+state.gardenFolders.filter(f=>f.section===id).length+'</span>':'')+'</button>').join('');
  h+='</div><div class="btnrow garden-quick"><button class="btn" onclick="openGardenFolderEditor(null,\'later\')">+ Сохранить идею</button></div><div class="garden-footer" aria-hidden="true">✿</div>';
  return h;
}
function gardenFolderRow(f){
  const photos=(f.photos||[]).filter(p=>safeImage(p.src));
  return '<button class="garden-folder" onclick="openGardenFolder(\''+f.id+'\')">'+(photos.length?'<img class="garden-cover" src="'+safeImage(photos[0].src)+'" alt="">':'<span class="garden-folder-icon" aria-hidden="true">'+GARDEN_SECTIONS[f.section].icon+'</span>')+'<span class="garden-folder-info"><span class="booktitle">'+esc(f.title)+'</span><span class="bookmeta" style="display:block">'+esc([f.section==='read'?GARDEN_MEDIA[f.medium]:'',gardenStatusLabel(f)].filter(Boolean).join(' · '))+'</span>'+(f.resume?'<span class="garden-resume">Продолжить: '+esc(f.resume)+'</span>':'')+'</span><span class="quiet" aria-hidden="true">›</span></button>';
}
function renderGardenSection(){
  const section=GARDEN_SECTIONS[gardenSection];if(!section){gardenSection=null;return renderGarden();}
  const folders=state.gardenFolders.filter(f=>f.section===gardenSection).slice().sort((a,b)=>(b.updatedAt||b.id).localeCompare(a.updatedAt||a.id));
  let h='<button class="quietbtn" onclick="setTab(\'garden\')">‹ Алисин сад</button><div class="eyebrow">'+section.icon+' Моя полка</div><h1 class="date">'+section.title+'</h1><p class="garden-welcome">'+section.hint+'</p>';
  h+=folders.length?folders.map(gardenFolderRow).join(''):'<div class="empty">'+({read:'Какая книга, фильм или спектакль ждут своего вечера?',make:'Что хочется сотворить? Сохраним задумку, материалы и фотографии.',projects:'У каждого проекта будет своя папочка с записями.',later:'Сюда можно бросить идею, ссылку или фоточку.'}[gardenSection])+'</div>';
  h+='<div class="btnrow"><button class="btn primary" onclick="openGardenFolderEditor(null,\''+gardenSection+'\')">'+(gardenSection==='later'?'+ Сохранить идею':'+ Новая папочка')+'</button></div>';
  return h;
}
function renderGardenFolder(){
  const f=gardenFolderById(selectedGardenFolder);if(!f){selectedGardenFolder=null;return renderGardenSection();}
  let h='<button class="quietbtn" onclick="openGardenSection(\''+f.section+'\')">‹ '+GARDEN_SECTIONS[f.section].title+'</button><div class="eyebrow">'+esc(gardenStatusLabel(f))+'</div><h1 class="date">'+esc(f.title)+'</h1>';
  if(f.section==='read')h+='<div class="bookmeta">'+esc([GARDEN_MEDIA[f.medium],f.creator].filter(Boolean).join(' · '))+'</div>';
  if(f.intent)h+='<h2 class="sect">'+(f.section==='read'?'О чём хочется помнить':'Что я хочу сделать')+'</h2><div class="notetext">'+esc(f.intent)+'</div>';
  if(f.resume)h+='<div class="garden-bookmark"><div class="quiet">С чего продолжить</div><div class="notetext">'+esc(f.resume)+'</div></div>';
  h+=gardenGallery(f.photos,'folder',f.id);
  h+='<div class="btnrow"><button class="btn primary" onclick="openGardenEntry(null,\''+f.id+'\')">+ Запись и фото</button><button class="btn" onclick="openGardenFolderEditor(\''+f.id+'\')">О папочке</button>'+(f.section==='later'?'<button class="btn" onclick="openGardenFolderEditor(\''+f.id+'\',\'projects\')">Сделать проектом</button>':'<button class="btn" onclick="continueGarden(\''+f.id+'\')">+ В мой день</button>')+'</div>';
  if(f.materials)h+='<h2 class="sect">Материалы и ссылки</h2><div class="notetext garden-materials">'+gardenMaterials(f.materials)+'</div>';
  h+='<h2 class="sect">'+(f.section==='read'?'Мои чтения и впечатления':'Мои записи')+'</h2>';
  const history=gardenHistory(f.id);
  h+=history.length?history.map(item=>gardenHistoryRow(item)).join(''):'<div class="empty">Здесь будут заметки и фотографии. Выполненные карточки Mother culture из дня тоже появятся здесь.</div>';
  const plans=state.cards.filter(c=>c.type==='Mother culture'&&c.gardenId===f.id&&c.status==='Planned');
  if(plans.length)h+='<h2 class="sect">Запланировано</h2>'+plans.map(c=>cardRow(c,true)).join('');
  return h;
}
function gardenHistoryRow(item){
  const n=item.data,card=item.kind==='card';
  let h='<article class="rec garden-entry"><div class="reading-top">'+(card?'<button class="quietbtn" style="padding-left:0" onclick="openDay(\''+n.date+'\')">'+fmtLong(n.date)+'</button>':'<span class="quiet">'+fmtLong(n.date)+'</span>')+'<span class="quiet">'+(card?(n.status==='Done'?'Сделано · Mother culture':'Немного · Mother culture'):'Заметка')+'</span></div>';
  if(n.title)h+='<div class="booktitle" style="font-size:18px">'+esc(n.title)+'</div>';
  const text=card?n.happened||n.details:n.text;
  if(text)h+='<div class="notetext">'+esc(text)+'</div>';
  if(n.materials)h+='<div class="notetext garden-materials"><span class="quiet">Материалы</span><br>'+gardenMaterials(n.materials)+'</div>';
  h+=gardenGallery(card?n.gardenPhotos:n.photos,item.kind,n.id);
  h+='<div class="btnrow" style="margin-bottom:0"><button class="btn small" onclick="'+(card?'openCard(\''+n.id+'\')':'openGardenEntry(\''+n.id+'\')')+'">'+(card?'Открыть карточку':'Изменить запись')+'</button></div></article>';
  return h;
}
function gardenGallery(photos,kind,id){
  if(!Array.isArray(photos)||!photos.length)return '';
  return '<div class="garden-gallery">'+photos.map((p,i)=>safeImage(p.src)?'<button class="garden-photo" onclick="openGardenPhoto(\''+kind+'\',\''+id+'\','+i+')"><img src="'+safeImage(p.src)+'" alt="'+esc(p.caption||'Открыть фотографию')+'">'+(p.caption?'<span>'+esc(p.caption)+'</span>':'')+'</button>':'').join('')+'</div>';
}
function gardenSourcePhotos(kind,id){
  const source=kind==='folder'?gardenFolderById(id):kind==='entry'?state.gardenEntries.find(n=>n.id===id):byId(id);
  return source?(kind==='card'?source.gardenPhotos:source.photos)||[]:[];
}
function openGardenPhoto(kind,id,index){
  const photos=gardenSourcePhotos(kind,id),p=photos[index];if(!p||!safeImage(p.src))return;
  openSheet('<h3 class="sheettitle">Фото · '+(index+1)+' из '+photos.length+'</h3><img class="garden-large-photo" src="'+safeImage(p.src)+'" alt="'+esc(p.caption||'Фотография')+'">'+(p.caption?'<div class="notetext">'+esc(p.caption)+'</div>':'')+'<div class="btnrow">'+(index>0?'<button class="btn" onclick="openGardenPhoto(\''+kind+'\',\''+id+'\','+(index-1)+')">‹ Предыдущее</button>':'')+(index<photos.length-1?'<button class="btn" onclick="openGardenPhoto(\''+kind+'\',\''+id+'\','+(index+1)+')">Следующее ›</button>':'')+'<button class="btn" onclick="closeSheet()">Закрыть</button></div>');
}
function gardenPhotoFields(key,photos){
  gardenPhotoDrafts[key]=(photos||[]).filter(p=>safeImage(p.src)).map(p=>({src:p.src,caption:p.caption||''}));
  return '<div class="field"><label for="gp-'+key+'-file">Фотографии</label><input type="file" id="gp-'+key+'-file" accept="image/jpeg,image/png,image/webp" multiple onchange="loadGardenPhotos(this,\''+key+'\')"><div id="gp-'+key+'-rows">'+gardenPhotoEditorRows(key)+'</div></div>';
}
function gardenPhotoEditorRows(key){
  return (gardenPhotoDrafts[key]||[]).map((p,i)=>'<div class="garden-photo-edit"><img class="garden-photo-thumb" src="'+safeImage(p.src)+'" alt="Прикреплённое фото"><div class="field"><label for="gp-'+key+'-caption-'+i+'">Подпись · необязательно</label><input type="text" id="gp-'+key+'-caption-'+i+'" value="'+esc(p.caption)+'"></div><button class="quietbtn danger" onclick="removeGardenPhoto(\''+key+'\','+i+')">Убрать фото</button></div>').join('');
}
function collectGardenPhotos(key){
  (gardenPhotoDrafts[key]||[]).forEach((p,i)=>{const input=document.getElementById('gp-'+key+'-caption-'+i);if(input)p.caption=input.value;});
  return gardenPhotoDrafts[key]||[];
}
async function loadGardenPhotos(input,key){
  const files=Array.from(input.files||[]);if(!files.length)return;
  collectGardenPhotos(key);
  const draft=gardenPhotoDrafts[key],target=document.getElementById('gp-'+key+'-rows');
  imageJobs++;input.disabled=true;
  const loading=document.createElement('p');loading.className='quiet';loading.textContent='Готовлю фотографии…';target.appendChild(loading);
  const failures=[];
  try{
    for(const file of files){
      try{const src=await compressPhoto(file);if(!target.isConnected)return;draft.push({src,caption:''});}
      catch(e){failures.push(file.name+': '+e.message);}
    }
    if(!target.isConnected)return;
    collectGardenPhotos(key);target.innerHTML=gardenPhotoEditorRows(key);
    if(failures.length)toast(failures.join(' '));
  }finally{imageJobs--;input.disabled=false;input.value='';if(loading.isConnected)loading.remove();}
}
function removeGardenPhoto(key,index){
  if(imageJobs){toast('Фото ещё готовится');return;}
  collectGardenPhotos(key);gardenPhotoDrafts[key].splice(index,1);
  document.getElementById('gp-'+key+'-rows').innerHTML=gardenPhotoEditorRows(key);
}
function openGardenFolderEditor(id,presetSection){

function updateGardenCardFields(prefix){

function keepGardenCard(c){

  h+='<div class="field"><label>Type</label><select id="f-type" onchange="updateReadingFields(\'f\')">'+TYPES.map(t=>'<option'+((c?c.type:(p?p.type:'Other'))===t?' selected':'')+'>'+t+'</option>').join('')+'</select></div>';

    +'<div class="btnrow" style="margin:8px 0 0"><button class="btn small" onclick="setDateField(1)">Tomorrow</button><button class="btn small" onclick="setDateField(0)">Today</button><button class="btn small" onclick="setDateField(null)">Idea Basket</button></div>'

  h+='<div class="field"><label>Materials</label><textarea id="f-materials" placeholder="Books, pages, supplies, links…">'+esc(c?c.materials:(p?p.materials:''))+'</textarea></div>';

  h+='<div class="field"><label>Общие заметки о детях</label><textarea id="f-childnotes" placeholder="Общий разговор, наблюдение о всех…">'+esc(c?c.childNotes:'')+'</textarea></div>';
  h+='<h2 class="sect">В детские тетради</h2><div class="sub">Запись сохранится у выбранного ребёнка и будет связана с этим занятием.</div><div id="f-entries">'+editorEntryRows()+'</div><button class="btn small" onclick="addEditorEntry()">+ Запись о ребёнке</button>';
  h+='<div class="btnrow" style="margin-bottom:0"><button class="quietbtn" onclick="saveToLibrary()">📚 Save to Library</button></div>';
  h+='<div class="btnrow"><button class="btn primary" onclick="saveCard(\''+(c?c.id:'')+'\')">Save</button><button class="btn" onclick="closeSheet()">Cancel</button>'
    +(c?'<button class="btn danger" style="margin-left:auto" onclick="delCard(\''+c.id+'\')">Delete</button>':'')+'</div>';

}
function pickStatus(el){ editorStatus=el.dataset.st; document.querySelectorAll('.statusrow .chip').forEach(x=>x.classList.toggle('sel',x===el)); }
function setDateField(offset){
  const f=document.getElementById('f-date');
  if(offset===null){ f.value=''; return; }
  const d=new Date(); d.setDate(d.getDate()+offset); f.value=iso(d);
}
function saveCard(id){
  if(imageJobs){toast('Фото ещё готовится');return;}
  const g=x=>document.getElementById(x).value;
  const title=g('f-title').trim();
  if(!title){ toast('A title helps you find it later'); return; }
  collectEditorEntries();
  if(editorEntries.some(n=>n.cardId&&!(n.text||'').trim()&&!n.image)){toast('В записи тетради нужен текст или фото. Можно оставить её только в тетради.');return;}
  const reading=readBookFields('f');if(!reading)return;
  const garden=readGardenCardFields('f');if(!garden)return;
  const data=Object.assign({title, type:g('f-type'), status:editorStatus, date:g('f-date')||null, details:g('f-details'), materials:g('f-materials'), happened:g('f-happened'), childNotes:g('f-childnotes')},reading,garden);
  let c;
  if(id){ c=byId(id); reopenCard(c); Object.assign(c,data); }
  else { c=Object.assign({id:uid(),createdAt:new Date().toISOString(),archived:false},data);state.cards.push(c); }
  saveEditorEntries(c);
  persist(); closeSheet(); render();
}
function delCard(id){
  if(!confirm('Delete this card? Записи в детских тетрадях и связанной папочке сада сохранятся.'))return;
  keepGardenCard(byId(id));
  state.childEntries.forEach(n=>{if(n.cardId===id)n.cardId=null;});
  state.cards=state.cards.filter(c=>c.id!==id);persist();closeSheet();render();
}

function saveTemplate(id){

  div.innerHTML='<div class="field" style="margin-top:0"><label>Title</label><input type="text" data-df="title" value=""></div>'

    +'<div class="field"><label>Days</label><div class="dayspick">'+WDS.map((w,i)=>'<button class="chip" data-day="'+i+'" onclick="this.classList.toggle(\'sel\')">'+w+'</button>').join('')+'</div></div>'
    +'<button class="quietbtn danger" onclick="this.closest(\'.basket\').remove()">Remove this default</button>';
  const rows=document.getElementById('sheetBody').querySelectorAll('.btnrow');
  rows[0].before(div);
}
function saveDefaults(){
  const blocks=document.getElementById('sheetBody').querySelectorAll('[id^="df-"]');
  const list=[];
  blocks.forEach(b=>{
    const title=b.querySelector('[data-df=title]').value.trim();
    if(!title) return;
    const type=b.querySelector('[data-df=type]').value;
    const days=[...b.querySelectorAll('[data-day].sel')].map(x=>+x.dataset.day);
    list.push({id:uid(),title,type,days});
  });
  state.defaults=list; persist(); closeSheet(); render(); toast('Defaults saved');
}

/* ============ Review wizard ============ */
let rw=null;
function startReview(date){
  const t=date||selectedDay;
  const record=state.records.find(r=>r.date===t);
  const todays=liveCards().filter(c=>c.date===t);
  const unfinished=todays.filter(c=>c.status==='Planned');
  rw={date:t, queue:unfinished.map(c=>c.id), idx:0, decisions:{},record:record||null};
  if(rw.queue.length) rwStep(); else rwCompose();
}
function rwStep(){
  if(rw.idx>=rw.queue.length){ rwCompose(); return; }
  const c=byId(rw.queue[rw.idx]);
  const t=rw.date;
  const week=weekDates(0).filter(d=>d>todayISO());
  let h='<div class="progress">'+(rw.idx+1)+' of '+rw.queue.length+' unfinished</div>';
  h+='<div class="wizcard"><div class="wt">'+esc(c.title)+'</div><div class="quiet">unfinished · '+fmtShort(t)+'</div></div>';
  h+='<div class="wizopts">';
  if(t<todayISO()) h+='<button class="btn" onclick="rwChoose(\'day:'+todayISO()+'\')">→ Move to today</button>';
  const tomorrow=new Date(); tomorrow.setDate(tomorrow.getDate()+1);
  h+='<button class="btn" onclick="rwChoose(\'day:'+iso(tomorrow)+'\')">→ Move to tomorrow</button>';
  if(week.length>1) h+='<button class="btn" onclick="rwLater()">→ Later this week…</button>';
  h+='<button class="btn" onclick="rwChoose(\'basket\')">→ Idea Basket</button>';
  h+='<button class="btn" onclick="rwChoose(\'skip\')">Let it go (skip)</button>';
  h+='</div><div class="btnrow" style="justify-content:center;margin-top:16px"><button class="quietbtn" onclick="closeSheet()">Cancel review</button></div>';
  openSheet(h);
}
function rwLater(){
  const week=weekDates(0).filter(d=>d>todayISO());
  let h='<div class="progress">choose a day</div>';
  h+='<div class="wizopts">'+week.map(d=>'<button class="btn" onclick="rwChoose(\'day:'+d+'\')">'+weekdayName(d)+' · '+fmtShort(d)+'</button>').join('')+'</div>';
  h+='<div class="btnrow" style="justify-content:center;margin-top:16px"><button class="quietbtn" onclick="rwStep()">back</button></div>';
  openSheet(h);
}
function rwChoose(opt){ rw.decisions[rw.queue[rw.idx]]=opt; rw.idx++; rwStep(); }

function snapToday(){
  const t=rw.date;
  const todays=liveCards().filter(c=>c.date===t);
  return todays.map(c=>{
    const dec=rw.decisions[c.id];
    let status=c.status, movedTo='';
    if(dec==='tomorrow'){status='Moved';movedTo='tomorrow';}
    else if(dec==='basket'){status='Moved';movedTo='Idea Basket';}
    else if(dec==='skip'){status='Skipped';}
    else if(dec&&dec.startsWith('day:')){status='Moved';movedTo=fmtLong(dec.slice(4));}
    const childBits=state.childEntries.filter(n=>n.cardId===c.id).map(n=>{
      const child=childById(n.childId);return (child?child.name+': ':'')+n.kind+(n.text?' — '+n.text:'')+(n.image?' [фото работы]':'');
    });
    return {id:c.id,title:c.title,type:c.type,status,movedTo,details:c.details||'',materials:c.materials||'',happened:c.happened||'',childNotes:[c.childNotes||'',...childBits].filter(Boolean).join('\n'),bookId:c.bookId||null,readingPosition:c.readingPosition||'',gardenId:c.gardenId||null};
  });
}
function buildReview(snaps){
  const lines=[];
  const names=s=>snaps.filter(c=>c.status===s).map(c=>c.title);
  const done=names('Done'), partial=names('Partial'), skipped=names('Skipped');
  const moved=snaps.filter(c=>c.status==='Moved');
  if(done.length) lines.push('Done: '+done.join(', ')+'.');
  if(partial.length) lines.push('Partial: '+partial.join(', ')+'.');
  if(moved.length) lines.push('Moved: '+moved.map(c=>c.title+(c.movedTo?' (to '+c.movedTo+')':'')).join(', ')+'.');
  if(skipped.length) lines.push('Skipped: '+skipped.join(', ')+'.');
  const noted=snaps.filter(c=>c.happened.trim()||c.childNotes.trim());
  if(noted.length){
    lines.push('','Notes:');
    noted.forEach(c=>{
      const bits=[c.happened.trim(),c.childNotes.trim()].filter(Boolean);
      lines.push(c.title+': '+bits.join(' — '));
    });
  }
  const mc=snaps.filter(c=>c.type==='Mother culture');
  if(mc.length){
    lines.push('','Mother culture: '+mc.map(c=>{const n=(c.happened||c.childNotes||'').trim(); return c.title+(n?' — '+n:'');}).join('; ')+'.');
  }
  if(!lines.length) lines.push('A quiet day — nothing recorded.');
  return lines.join('\n');
}
function rwCompose(){
  const snaps=snapToday();
  const previous=rw.record ? (rw.record.cards||[]) : [];
  const ids=new Set(snaps.map(s=>s.id));
  rw.snaps=previous.filter(s=>!s.id||!ids.has(s.id)).concat(snaps);
  const saved=rw.record ? (rw.record.review||'') : '';
  const text=rw.record ? saved+(snaps.length?'\n\n'+buildReview(snaps):'') : buildReview(snaps);
  let h='<h3 class="sheettitle">Review · '+fmtShort(rw.date)+'</h3><div class="sub">Edit anything before saving. Your previous review is kept here.</div>';
  h+='<div class="field"><textarea id="rv-text" style="min-height:260px;font-family:var(--serif);line-height:1.6">'+esc(text)+'</textarea></div>';
  h+='<div class="btnrow"><button class="btn primary" onclick="rwSave()">Save to Archive</button><button class="btn" onclick="closeSheet()">Cancel</button></div>';
  openSheet(h);
}
function rwSave(){
  const t=rw.date;
  const review=document.getElementById('rv-text').value;
  // apply decisions to real cards
  const todays=liveCards().filter(c=>c.date===t);
  todays.forEach(c=>{
    const dec=rw.decisions[c.id];
    if(dec==='tomorrow'){ const d=fromISO(t); d.setDate(d.getDate()+1); c.date=iso(d); c.status='Planned'; }
    else if(dec==='basket'){ c.date=null; c.status='Planned'; }
    else if(dec==='skip'){ c.status='Skipped'; c.archived=true; }
    else if(dec&&dec.startsWith('day:')){ c.date=dec.slice(4); c.status='Planned'; }
    else { c.archived=true; } // Done / Partial / manually Moved or Skipped — folded into the day
  });
  state.records=state.records.filter(r=>r.date!==t);
  state.records.push({id:rw.record?rw.record.id:uid(),date:t,review,cards:rw.snaps});
  rw=null; persist(); closeSheet(); setTab('archive'); toast('Day kept ✓');
}

/* ============ Backup ============ */
function openBackup(){
  let h='<h3 class="sheettitle">Backup</h3><div class="sub">Your diary lives only on this device. Once in a while, copy a backup somewhere safe (notes app, email to yourself…).</div>';
  h+='<div class="btnrow"><button class="btn" onclick="doExport()">Show backup text</button><button class="btn" onclick="doDownload()">Download file</button></div>';
  h+='<div class="field"><label>Backup text</label><textarea id="bk-text" style="min-height:120px" placeholder="Tap “Show backup text”, then copy it. To restore: paste a backup here and tap Restore."></textarea></div>';
  h+='<div class="btnrow"><button class="btn" onclick="doCopy()">Copy</button><button class="btn danger" onclick="doImport()">Restore from pasted text</button><button class="btn" style="margin-left:auto" onclick="closeSheet()">Close</button></div>';
  openSheet(h);
}
function doExport(){ document.getElementById('bk-text').value=JSON.stringify(state); toast('Backup text ready — copy it'); }
function doCopy(){
  const t=document.getElementById('bk-text'); if(!t.value) doExport();
  t.select(); t.setSelectionRange(0,99999999);
  try{ navigator.clipboard.writeText(t.value).then(()=>toast('Copied')); }catch(e){ document.execCommand('copy'); toast('Copied'); }
}
function doDownload(){
  try{
    const blob=new Blob([JSON.stringify(state)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='hearth-backup-'+todayISO()+'.json';
    document.body.appendChild(a); a.click(); a.remove();
  }catch(e){ toast('Download blocked here — use “Show backup text”'); }
}
function doImport(){
  const raw=document.getElementById('bk-text').value.trim();
  if(!raw){ toast('Paste a backup first'); return; }
  let obj;
  try{ obj=JSON.parse(raw); }catch(e){ toast('That doesn\'t look like a Hearth backup'); return; }
  if(!obj||!Array.isArray(obj.cards)){ toast('That doesn\'t look like a Hearth backup'); return; }
  if(!confirm('Replace everything in the app with this backup?')) return;
  state=normalizeState(obj);selectedBook=null;selectedChild=null;selectedGardenFolder=null;gardenSection=null;persist();closeSheet();render();toast('Restored ✓');
}

/* ============ boot ============ */
(async function(){
  const loaded=await Store.load();
  state=normalizeState(loaded||freshState());
  render();
  persist();
  if('serviceWorker' in navigator && location.protocol==='https:'){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
})();
</script>
